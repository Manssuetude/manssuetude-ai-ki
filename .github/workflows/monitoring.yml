name: Monitoring des liens

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"   # tous les jours à 6 h 17 (heure de Paris en hiver)
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier liens, fichiers de commission et templates Drive
        run: python scripts/check_links.py
